data_paths:
  panel: data/processed/flood_dataset.parquet
  nodes: data/processed/nodes.csv
  edges_flow: data/processed/edges.csv
  edges_spatial: data/processed/edges.csv
  sar_chips: data/sar_chips/

# NOTE: this `splits:` block is informational only — src/data/dataset.py never
# reads it. The actual train/val/test filtering comes from the precomputed
# `split_temporal` / `split_basin_holdout` columns already baked into
# flood_dataset.parquet. These year ranges document what those columns
# actually contain (verified against the parquet directly), not a knob you
# can turn here — to change the real split, the parquet's split column has
# to be regenerated upstream.
# Drop a ragged trailing period before anything else sees it. 2025 contributes
# 1,092 valid rows against ~18,600 for every complete year, so leaving it in the
# test split folds a 3-week sliver into a 4-year average invisibly. The sibling
# repo applies the same 2024-12-31 cutoff as its documented ragged-2025 policy.
truncate_after: "2024-12-31"

splits:
  temporal:
    train_years: [2003, 2017]   # inclusive range, not an enumerated list
    val_years: [2018, 2020]
    test_years: [2021, 2024]   # 2025 excluded by truncate_after above
  basin_holdout:
    holdout_basin: "Gin"
