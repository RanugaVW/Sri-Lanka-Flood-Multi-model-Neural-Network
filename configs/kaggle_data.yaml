data_paths:
  # ── Tabular + Graph dataset ───────────────────────────────────────────────
  # Dataset: "Sri Lanka Flood Tabular Graph 2003-2025"
  # Kaggle URL: https://www.kaggle.com/datasets/uom230429e/sri-lanka-flood-tabular-graph-2003-2025
  # Mounts at: /kaggle/input/sri-lanka-flood-tabular-graph-2003-2025/
  panel:         /kaggle/input/sri-lanka-flood-tabular-graph-2003-2025/flood_dataset.parquet
  nodes:         /kaggle/input/sri-lanka-flood-tabular-graph-2003-2025/nodes.csv
  edges_flow:    /kaggle/input/sri-lanka-flood-tabular-graph-2003-2025/edges.csv
  edges_spatial: /kaggle/input/sri-lanka-flood-tabular-graph-2003-2025/edges.csv

  # ── SAR image dataset ─────────────────────────────────────────────────────
  # Dataset: "Sri Lanka Flood Sentinel-1 SAR 2015-2025"
  # Kaggle URL: https://www.kaggle.com/datasets/uom230429e/flood-data-set
  # Mounts at: /kaggle/input/flood-data-set/
  # Structure inside: sar_chips/sar_flood_lite/frames/<SITE_ID>/<YYYY-MM-DD>.png
  sar_chips: /kaggle/input/flood-data-set/sar_chips/sar_flood_lite

splits:
  temporal:
    train_years: [2020, 2021, 2022]
    val_years: [2023]
    test_years: [2024]
  basin_holdout:
    holdout_basin: "Gin"
