  nodes:         /kaggle/input/datasets/uom230429e/sri-lanka-flood-tabular-graph-2003-2025/nodes.csv
  edges_flow:    /kaggle/input/datasets/uom230429e/sri-lanka-flood-tabular-graph-2003-2025/edges.csv
  edges_spatial: /kaggle/input/datasets/uom230429e/sri-lanka-flood-tabular-graph-2003-2025/edges.csv

  # ── SAR image dataset ─────────────────────────────────────────────────────
